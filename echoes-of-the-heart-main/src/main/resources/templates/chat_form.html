<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poem Music AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f7f9fc, #e9eef6);
            position: relative;
        }

        .top-nav {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 10px;
        }

        .top-login-btn {
            text-decoration: none;
            color: #4e5968;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 18px;
            background: white;
            border: 1px solid #e3e6ee;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .top-login-btn:hover {
            background: #fafbff;
            border-color: #6c63ff;
            color: #6c63ff;
            transform: translateY(-1px);
        }

        .card {
            width: 100%;
            max-width: 760px;
            background: white;
            padding: 52px;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            text-align: center;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .subtitle {
            color: #666;
            margin-bottom: 34px;
            line-height: 1.7;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 170px;
            border: 1px solid #e3e6ee;
            border-radius: 18px;
            padding: 20px;
            font-size: 1rem;
            resize: none;
            outline: none;
            background: #fafbff;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #6c63ff;
            background: white;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.12);
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 17px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c63ff, #5a52e0);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.18);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 24px rgba(108, 99, 255, 0.24);
        }

        @media (max-width: 480px) {
            body { padding-top: 80px; }
            .card { padding: 30px 20px; }
            h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<div class="top-nav">
    <a th:href="@{/login}" class="top-login-btn">로그인</a>
    <a th:href="@{/sign}" class="top-login-btn">회원가입</a>
</div>

<div class="card">
    <h1>🎵 시를 입력하면 음악을 추천해드려요</h1>
    <p class="subtitle">
        오늘의 감정, 짧은 시, 떠오르는 문장을 입력해보세요.<br>
        AI가 분위기를 분석하고 어울리는 음악을 추천합니다.
    </p>

    <form th:action="@{/create-poem-music}" method="get">
        <textarea name="poem" placeholder="예) 오늘은 괜히 마음이 울적했다..." required></textarea>
        <button type="submit">감성 분석 시작하기</button>
    </form>
</div>

</body>
</html>
