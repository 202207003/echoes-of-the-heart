<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music AI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #f7f9fc, #e9eef6);
            font-family: 'Pretendard', sans-serif;
            padding-bottom: 40px;
        }

        .top-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e3e6ee;
            padding: 16px 0;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #6c63ff;
            text-decoration: none;
        }

        .top-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-welcome {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4e5968;
            margin-right: 6px;
        }

        .top-login-btn {
            text-decoration: none;
            color: #4e5968;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 18px;
            background: white;
            border: 1px solid #e3e6ee;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .top-login-btn:hover {
            background: #fafbff;
            border-color: #6c63ff;
            color: #6c63ff;
            transform: translateY(-1px);
        }

        .card {
            margin: auto 0;
            width: 100%;
            max-width: 760px;
            background: white;
            padding: 52px;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            text-align: center;
            transition: 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #222;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .subtitle {
            color: #666;
            margin-bottom: 34px;
            line-height: 1.7;
            font-size: 1rem;
        }

        textarea {
            width: 100%;
            min-height: 170px;
            border: 1px solid #e3e6ee;
            border-radius: 18px;
            padding: 20px;
            font-size: 1rem;
            resize: none;
            outline: none;
            background: #fafbff;
            transition: all 0.3s ease;
        }

        textarea:focus {
            border-color: #6c63ff;
            background: white;
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.12);
        }

        .input-hint {
            margin-top: 10px;
            color: #777;
            font-size: 0.85rem;
            line-height: 1.6;
            text-align: left;
            word-break: keep-all;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 17px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #6c63ff, #5a52e0);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(108, 99, 255, 0.18);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 24px rgba(108, 99, 255, 0.24);
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .header-container {
                padding: 0 16px;
            }

            .top-nav {
                gap: 6px;
            }

            .top-login-btn {
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body>

<header class="top-header">
    <div class="header-container">

        <a th:href="@{/chat}" class="logo">Music AI</a>

        <div class="top-nav">

            <th:block th:if="${session.username != null}">
                <span class="user-welcome"
                      th:text="${session.username} + '님 안녕하세요!'"></span>

                <a th:href="@{/history}" class="top-login-btn">채팅기록</a>
                <a th:href="@{/logout}" class="top-login-btn">로그아웃</a>
            </th:block>

            <th:block th:unless="${session.username != null}">
                <a th:href="@{/login}" class="top-login-btn">로그인</a>
                <a th:href="@{/sign}" class="top-login-btn">회원가입</a>
            </th:block>

        </div>
    </div>
</header>

<div class="card">

    <h1>🎵 감정을 입력하면 시와 음악을 추천해드려요</h1>

    <p class="subtitle">
        오늘의 감정, 짧은 시, 떠오르는 문장을 입력해보세요.<br>
        다음 화면에서 마음에 끌리는 그림을 고르거나 건너뛸 수 있어요.<br>
        입력한 감정을 중심으로 시와 음악을 추천해요.
    </p>

    <form th:action="@{/emotion-analysis}" method="get">

        <textarea
            name="poem"
            placeholder="예) 오늘은 괜히 마음이 울적했다..."
            aria-describedby="poem-input-hint"
            required></textarea>

        <p id="poem-input-hint" class="input-hint">
            마침표(.)·느낌표(!)·물음표(?)나 줄바꿈을 넣으면 문장을 더 정확하게 구분할 수 있어요.
        </p>

        <button type="submit">감성 분석 시작하기</button>

    </form>

</div>

</body>
</html>
