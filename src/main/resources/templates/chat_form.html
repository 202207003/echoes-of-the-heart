<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music AI</title>

    <link rel="stylesheet" th:href="@{/css/app.css(v='20261104-4')}">
    <link rel="stylesheet" th:href="@{/css/analysis-progress.css(v='20261104-3')}">
    <script defer th:src="@{/js/request-loading.js(v='20261104-3')}"></script>
</head>

<body class="chat-page">

<header class="top-header">
    <div class="header-container">

        <a th:href="@{/chat}" class="logo">Music AI</a>

        <div class="top-nav">

            <th:block th:if="${session.username != null}">
                <span class="user-welcome"
                      th:text="${session.username} + '님 안녕하세요!'"></span>

                <a th:href="@{/history}" class="top-login-btn">나의 기록</a>
                <a th:href="@{/logout}" class="top-login-btn">로그아웃</a>
            </th:block>

            <th:block th:unless="${session.username != null}">
                <a th:href="@{/login}" class="top-login-btn">로그인</a>
                <a th:href="@{/sign}" class="top-login-btn">회원가입</a>
            </th:block>

        </div>
    </div>
</header>

<div class="card">

    <span class="eyebrow">A MOMENT FOR YOUR HEART</span>
    <h1>오늘의 마음이,<br>시와 음악이 되는 순간</h1>

    <p class="subtitle">
        말로 다 표현하지 못한 마음도 괜찮아요.<br>
        짧은 문장 하나로, 당신을 위한 시와 음악을 만나보세요.
    </p>

    <ol class="flow-steps" aria-label="진행 단계">
        <li class="active" aria-current="step"><span>1</span>마음 쓰기</li>
        <li><span>2</span>분위기 고르기</li>
        <li><span>3</span>시와 음악</li>
    </ol>

    <form th:action="@{/emotion-analysis}" method="get"
          data-loading-title="당신의 마음을 살펴보고 있어요"
          data-loading-description="입력한 문장의 감정을 읽고, 어울리는 그림을 준비하고 있어요.">

        <p class="generation-error" th:if="${generationError}" th:text="${generationError}" role="alert"></p>

        <label for="poem-input" class="field-label">지금 어떤 마음인가요?</label>
        <textarea id="poem-input"
            name="poem"
            placeholder="예) 오늘은 괜히 마음이 울적했다..."
            aria-describedby="poem-input-hint"
            required th:text="${originalPoem}"></textarea>

        <p id="poem-input-hint" class="input-hint">
            마침표(.)·느낌표(!)·물음표(?)나 줄바꿈을 넣으면 문장을 더 정확하게 구분할 수 있어요.
        </p>

        <button type="submit" class="primary-btn">내 마음에 어울리는 분위기 찾기 →</button>

    </form>

</div>

<div th:replace="~{fragments/request-loading :: dialog}"></div>

</body>
</html>
