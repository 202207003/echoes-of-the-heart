<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 상세 - Music AI</title>
    <link rel="stylesheet" th:href="@{/css/history.css}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #f7f9fc, #e9eef6);
            font-family: 'Pretendard', sans-serif;
            color: #222;
            padding-bottom: 60px;
        }

        /* 1. 상단 헤더 띠 전체 영역 */
        .top-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e3e6ee;
            padding: 16px 0;
            margin-bottom: 30px;
        }

        /* 2. 헤더 내부 콘텐츠 레이아웃 (양끝 정렬) */
        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 3. 좌측 서비스 로고 */
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #6c63ff;
            text-decoration: none;
        }

        /* 4. 우측 버튼 네비게이션 영역 */
        .top-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-welcome {
            font-size: 0.9rem;
            font-weight: 600;
            color: #4e5968;
            margin-right: 6px;
        }

        .top-login-btn {
            text-decoration: none;
            color: #4e5968;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px 18px;
            background: white;
            border: 1px solid #e3e6ee;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
        }

        .top-login-btn:hover {
            background: #fafbff;
            border-color: #6c63ff;
            color: #6c63ff;
            transform: translateY(-1px);
        }

        /* 메인 레이아웃 영역 */
        .container {
            width: 100%;
            max-width: 760px;
            padding: 0 20px;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 20px;
            color: #6c63ff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: #5a52e0;
            text-decoration: underline;
        }

        .detail-card {
            background: white;
            border-radius: 28px;
            padding: 42px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
        }

        .detail-date {
            font-size: 0.9rem;
            color: #8b95a1;
            margin-bottom: 24px;
        }

        .detail-card h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #222;
            margin-top: 24px;
            margin-bottom: 10px;
            border-left: 4px solid #6c63ff;
            padding-left: 10px;
        }

        .detail-card p {
            line-height: 1.7;
            color: #4e5968;
            font-size: 1rem;
        }

        .poem {
            white-space: pre-wrap;
            line-height: 2;
            font-size: 1.05rem;
            color: #333;
            background: #fafbff;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #e3e6ee;
            margin-top: 8px;
            font-style: italic;
        }

        .audio-wrapper {
            margin-top: 14px;
            background: #fafbff;
            padding: 16px;
            border-radius: 18px;
            border: 1px dashed #dbe1ec;
        }

        audio {
            width: 100%;
            outline: none;
        }

        @media (max-width: 480px) {
            .detail-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<!-- 상단 헤더 바 -->
<header class="top-header">
    <div class="header-container">
        <!-- 좌측 로고 -->
        <a th:href="@{/chat}" class="logo">Music AI</a>

        <!-- 우측 네비게이션 버튼 -->
        <div class="top-nav">
            <!-- 1. 로그인 상태일 때 -->
            <th:block th:if="${session.username != null}">
                <span class="user-welcome" th:text="${session.username} + '님 안녕하세요!'"></span>
                <a th:href="@{/history}" class="top-login-btn">채팅기록</a>
                <a th:href="@{/logout}" class="top-login-btn">로그아웃</a>
            </th:block>

            <!-- 2. 로그인 안 했을 때 -->
            <th:block th:unless="${session.username != null}">
                <a th:href="@{/login}" class="top-login-btn">로그인</a>
                <a th:href="@{/sign}" class="top-login-btn">회원가입</a>
            </th:block>
        </div>
    </div>
</header>

<div class="container">

    <a class="back-button" th:href="@{/history}">
        ← 기록 목록으로
    </a>

    <section class="detail-card">

        <p class="detail-date"
           th:text="${#temporals.format(history.createdAt, 'yyyy년 M월 d일 HH:mm')}">
            2026년 9월 21일 21:13
        </p>

        <h2>질문</h2>
        <p th:text="${history.question}">
            오늘은 하루 종일 비가 내렸다.
        </p>

        <h2>시</h2>
        <div class="poem"
             th:text="${history.poem}">
            생성된 시 내용
        </div>

        <h2>음악</h2>
        <p th:text="${history.musicTitle}">
            Rainy Evening
        </p>

        <div class="audio-wrapper" th:if="${history.musicUrl != null}">
            <audio controls>
                <source th:src="${history.musicUrl}" type="audio/mpeg">
                브라우저에서 음악을 재생할 수 없습니다.
            </audio>
        </div>

    </section>

</div>

</body>
</html>
