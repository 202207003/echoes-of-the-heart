<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기록 상세 - Music AI</title>


    <link rel="stylesheet" th:href="@{/css/app.css(v='20261104-4')}">
</head>
<body class="history-detail-page">

<!-- 상단 헤더 바 -->
<header class="top-header">
    <div class="header-container">
        <!-- 좌측 로고 -->
        <a th:href="@{/chat}" class="logo">Music AI</a>

        <!-- 우측 네비게이션 버튼 -->
        <div class="top-nav">
            <!-- 1. 로그인 상태일 때 -->
            <th:block th:if="${session.username != null}">
                <span class="user-welcome" th:text="${session.username} + '님 안녕하세요!'"></span>
                <a th:href="@{/history}" class="top-login-btn">나의 기록</a>
                <a th:href="@{/logout}" class="top-login-btn">로그아웃</a>
            </th:block>

            <!-- 2. 로그인 안 했을 때 -->
            <th:block th:unless="${session.username != null}">
                <a th:href="@{/login}" class="top-login-btn">로그인</a>
                <a th:href="@{/sign}" class="top-login-btn">회원가입</a>
            </th:block>
        </div>
    </div>
</header>

<div class="container">

    <a class="back-button" th:href="@{/history}">
        ← 기록 목록으로
    </a>

    <section class="detail-card">

        <p class="detail-date"
           th:text="${#temporals.format(history.createdAt, 'yyyy년 M월 d일 HH:mm')}">
            2026년 9월 21일 21:13
        </p>

        <span class="eyebrow">A PAGE OF YOUR HEART</span>
        <h1>이날의 마음</h1>
        <h2>내가 남긴 문장</h2>
        <p th:text="${history.question}">
            오늘은 하루 종일 비가 내렸다.
        </p>

        <h2>시</h2>
        <div class="poem"
             th:text="${history.poem}">
            생성된 시 내용
        </div>

        <h2>음악</h2>
        <p th:text="${history.musicTitle}">
            Rainy Evening
        </p>
        <p th:if="${history.musicUrl == null}" class="regenerate-hint">이 기록에는 저장된 음악이 없어요.</p>

        <div class="audio-wrapper" th:if="${history.musicUrl != null}">
            <audio controls>
                <source th:src="${history.musicUrl}" type="audio/mpeg">
                브라우저에서 음악을 재생할 수 없습니다.
            </audio>
        </div>

    </section>

</div>

</body>
</html>
