<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 기록 - Music AI</title>


    <link rel="stylesheet" th:href="@{/css/app.css(v='20261104-4')}">
</head>
<body class="history-page">

<!-- 상단 헤더 바 -->
<header class="top-header">
    <div class="header-container">
        <!-- 좌측 로고 -->
        <a th:href="@{/chat}" class="logo">Music AI</a>

        <!-- 우측 네비게이션 버튼 -->
        <div class="top-nav">
            <!-- 1. 로그인 상태일 때 -->
            <th:block th:if="${session.username != null}">
                <span class="user-welcome" th:text="${session.username} + '님 안녕하세요!'"></span>
                <a th:href="@{/history}" class="top-login-btn" aria-current="page">나의 기록</a>
                <a th:href="@{/logout}" class="top-login-btn">로그아웃</a>
            </th:block>

            <!-- 2. 로그인 안 했을 때 -->
            <th:block th:unless="${session.username != null}">
                <a th:href="@{/login}" class="top-login-btn">로그인</a>
                <a th:href="@{/sign}" class="top-login-btn">회원가입</a>
            </th:block>
        </div>
    </div>
</header>

<div class="container">

    <header class="header">
        <span class="eyebrow">MOMENTS TO KEEP</span>
        <h1>나의 기록</h1>
        <p>생성한 시와 음악을 날짜별로 확인해보세요.</p>
    </header>

    <section class="calendar-section">

        <div class="calendar-header">
            <a th:href="@{/history(date=${selectedDate.minusMonths(1)})}" aria-label="이전 달">‹</a>

            <h2 th:text="${selectedDate.year + '년 ' + selectedDate.monthValue + '월'}">
                2026년 9월
            </h2>

            <a th:href="@{/history(date=${selectedDate.plusMonths(1)})}" aria-label="다음 달">›</a>
        </div>

        <div class="weekdays">
            <div>일</div>
            <div>월</div>
            <div>화</div>
            <div>수</div>
            <div>목</div>
            <div>금</div>
            <div>토</div>
        </div>

        <div class="calendar">

            <th:block th:if="${selectedDate.withDayOfMonth(1).dayOfWeek.value % 7 > 0}">
            <div
                class="calendar-day empty"
                th:each="i : ${#numbers.sequence(1, selectedDate.withDayOfMonth(1).dayOfWeek.value % 7)}">
            </div>
            </th:block>

            <a
                class="calendar-day"
                th:each="day : ${#numbers.sequence(1, selectedDate.lengthOfMonth())}"
                th:classappend="${historyDays.contains(day)} ? ' has-history' : ' no-history'"
                th:attr="aria-current=${day == selectedDate.dayOfMonth ? 'date' : null},aria-label=${selectedDate.monthValue + '월 ' + day + '일' + (historyDays.contains(day) ? ', 저장된 기록 있음' : '')}"
                th:href="@{/history(date=${selectedDate.withDayOfMonth(day)})}"
                th:text="${day}">
                1
            </a>
        </div>
        <p class="calendar-note">작은 점이 있는 날에는 시와 음악이 저장되어 있어요.</p>

    </section>

    <section class="history-section">

        <h2
            th:text="${selectedDate.monthValue + '월 ' + selectedDate.dayOfMonth + '일 기록'}">
            9월 21일 기록
        </h2>

        <div class="history-list">

            <div
                class="empty-message"
                th:if="${#lists.isEmpty(histories)}">
                이 날짜에는 저장된 기록이 없습니다.
                <br><a th:href="@{/chat}">새로운 마음 기록 남기기 →</a>
            </div>

            <a
                class="history-card"
                th:each="history : ${histories}"
                th:href="@{/history/{id}(id=${history.id})}">

                <div
                    class="time"
                    th:text="${#temporals.format(history.createdAt, 'HH:mm')}">
                    21:13
                </div>

                <div
                    class="question"
                    th:text="${history.question}">
                    오늘은 하루 종일 비가 내렸다.
                </div>

            </a>

        </div>

    </section>

</div>

</body>
</html>
