<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Poem Music AI</title>

    <link rel="stylesheet" th:href="@{/css/app.css(v='20261104-4')}">
</head>
<body class="auth-page">

<a th:href="@{/chat}" class="logo auth-brand">Music AI</a>

<div class="card">
    <h2>로그인</h2>
    <p class="auth-subtitle">당신의 마음이 담긴 기록을 이어가세요.</p>
    <p class="login-message" th:if="${resultId != null}">로그인 후 방금 만든 시와 음악으로 돌아가요.<br>결과는 내 기록에도 저장돼요.</p>
    <p class="login-message" th:if="${loginNotice}" th:text="${loginNotice}" role="status"></p>
    <p class="login-message error" th:if="${loginError}" th:text="${loginError}" role="alert"></p>
    <form th:action="@{/login}" method="post">
        <input th:if="${resultId != null}" type="hidden" name="resultId" th:value="${resultId}">
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" autocomplete="username" th:value="${loginUsername}" placeholder="아이디를 입력해주세요" required>
        </div>
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력해주세요" required>
        </div>
        <button type="submit">로그인</button>
    </form>
    <div class="extra-links">
        <a th:href="@{/sign(resultId=${resultId})}">아직 계정이 없으신가요? 회원가입</a>
    </div>
</div>
<a th:if="${resultId != null}" th:href="@{/music-result(resultId=${resultId})}" class="auth-back">← 시와 음악으로 돌아가기</a>
<a th:unless="${resultId != null}" th:href="@{/chat}" class="auth-back">← 마음 쓰기로 돌아가기</a>

</body>
</html>
