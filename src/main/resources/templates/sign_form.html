<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
</head>
<body>
    <h2>회원가입</h2>
	<form th:action="@{/sign}" method="post">
	    아이디: <input type="text" name="username" required> <br><br>
	    비밀번호: <input type="password" name="password" required> <br><br>
	    <button type="submit">회원가입</button>
	</form>
</body>
</html>
