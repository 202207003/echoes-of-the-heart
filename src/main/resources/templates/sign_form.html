<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Poem Music AI</title>

    <link rel="stylesheet" th:href="@{/css/app.css(v='20261104-4')}">
</head>

<body class="auth-page">

    <a th:href="@{/chat}" class="logo auth-brand">Music AI</a>

    <div class="card">

        <h2>회원가입</h2>
        <p class="auth-subtitle">지나가는 감정을, 다시 꺼내볼 수 있는 기록으로.</p>

        <form th:action="@{/sign}" method="post">

            <input th:if="${resultId != null}" type="hidden" name="resultId" th:value="${resultId}">

            <div class="input-group">
                <label for="username">아이디</label>

                <div class="input-row">
                    <input type="text"
                           id="username"
                           name="username"
                           autocomplete="username"
                           aria-describedby="username-status"
                           placeholder="아이디를 입력해주세요"
                           required>

                    <button type="button"
                            id="checkBtn"
                            class="inline-btn">
                        중복확인
                    </button>
                </div>
                <p id="username-status" class="username-status" role="status" aria-live="polite"></p>
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>

                <input type="password"
                       id="password"
                       name="password"
                       autocomplete="new-password"
                       placeholder="비밀번호를 입력해주세요"
                       required>
            </div>

            <div class="input-group">
                <label for="mbti">MBTI</label>

                <input type="text"
                       id="mbti"
                       name="mbti"
                       placeholder="MBTI를 입력해주세요"
                       required>
            </div>

            <button type="submit" class="submit-btn">
                회원가입
            </button>

        </form>

        <div class="extra-links">
            <a th:href="@{/login(resultId=${resultId})}">
                이미 계정이 있으신가요? 로그인
            </a>
        </div>

    </div>

    <a th:href="@{/chat}" class="auth-back">← 마음 쓰기로 돌아가기</a>
    <script>
        document.getElementById("checkBtn").addEventListener("click", function() {

            const username = document.getElementById("username").value;

            if (!username.trim()) {
                document.getElementById("username-status").textContent = "아이디를 입력한 후 중복확인을 해주세요.";
                document.getElementById("username").focus();
                return;
            }

            const checkButton = document.getElementById("checkBtn");
            const status = document.getElementById("username-status");
            checkButton.disabled = true;
            status.textContent = "사용 가능한 아이디인지 확인하고 있어요…";
            fetch("/checkUsername?username=" + encodeURIComponent(username))
                .then(response => {
                    if (!response.ok) throw new Error("Username check failed");
                    return response.text();
                })
                .then(data => {
                    if (document.getElementById("username").value === username) status.textContent = data;
                })
                .catch(error => {
                    status.textContent = "확인하지 못했어요. 잠시 후 다시 시도해주세요.";
                })
                .finally(() => { checkButton.disabled = false; });

            document.getElementById("username").focus();
        });
        document.getElementById("username").addEventListener("input", () => {
            document.getElementById("username-status").textContent = "";
        });
    </script>

</body>
</html>
